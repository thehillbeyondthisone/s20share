<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffc61a"><title>Studio on Meta Quest · Yellow Umbrella Group</title>
<style>
:root{font:16px/1.6 system-ui;color:#161d38;background:#f6f8fc}body{margin:0;border-top:5px solid #ffc61a}main{max-width:500px;margin:12vh auto;padding:24px}small{letter-spacing:.12em}h1{font-size:36px;line-height:1.15}a{color:inherit}a.button{display:inline-block;padding:12px 18px;background:#ffc61a;border-radius:7px;text-decoration:none;font-weight:600}:focus-visible{outline:3px solid #161d38;outline-offset:4px}[hidden]{display:none!important}
</style>
</head>
<body><main><small>☂ YELLOW UMBRELLA GROUP</small><h1>Step inside the studio.</h1>
<p id="status" role="status">Opening the latest studio walkthrough…</p>
<a id="open" class="button" hidden>Open studio</a><p><a href="../">Back to the collection</a></p>
<noscript><p>Enable JavaScript to open the latest Quest walkthrough.</p></noscript></main>
<script>
(async()=>{
  try {
    const response=await fetch('../catalog.json',{cache:'no-store'});
    if (!response.ok) throw Error('Catalog unavailable');
    const catalog=await response.json();
    const scan=catalog.scans?.find(scan=>scan.id==='27e45466-86a5-42c6-8018-df7c9fdd86ea' && scan.quest_preview);
    if (!scan) throw Error('Quest viewer unavailable');
    const target=new URL(scan.viewer,new URL('../',location.href));
    if (target.origin!==location.origin || !target.pathname.startsWith(new URL('../viewers/',location.href).pathname)) throw Error('Invalid viewer');
    target.searchParams.set('quest','1');
    const link=document.getElementById('open'); link.href=target.href; link.hidden=false;
    location.replace(target.href);
  } catch {
    document.getElementById('status').textContent='The studio could not load. Return to the collection and try again.';
  }
})();
</script></body></html>
